<!-- semantic tags are used to give meaning to the content of a webpage. They help search engines and other tools understand the structure and content of a webpage. Some examples of semantic tags are <header>, <footer>, <article>, <section>, <nav>, <aside>, and <main>. These tags provide context to the content they contain, making it easier for users and search engines to navigate and understand the webpage. -->
<!-- Examples of semantic tags are: -->
<video src="" controls></video>

<header style="background-color: blue">Header</header>

<footer style="background-color: blue">Footer</footer>

<main style="background-color: blue">Main Content</main>

<nav style="background-color: blue">Navigation</nav>

<article style="background-color: blue">Article</article>

<aside style="background-color: blue">Aside</aside>

<!-- non semantic tags are used to create a structure for the webpage, but they do not provide any meaning to the content they contain. Some examples of non-semantic tags are <div> and <span>. These tags are used to group elements together and apply styles to them, but they do not provide any context to the content they contain. -->
<!-- Examples of non-semantic tags are: -->
<div style="background-color: lightblue">Div</div>

<span style="background-color: lightblue">Span</span>

<!-- Search Engine Optimization (SEO) is the practice of optimizing a website to improve its visibility and ranking on search engine results pages (SERPs). It involves various techniques and strategies to make a website more search engine-friendly, such as optimizing content, improving site structure, enhancing user experience, and building high-quality backlinks. The goal of SEO is to increase organic traffic to a website by making it more discoverable and relevant to users' search queries. -->
