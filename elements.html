<!-- video tag is used to insert a video in the webpage. It is defined by the <video> tag. The src attribute is used to specify the URL of the video. The controls attribute is used to display the video controls, such as play, pause, and volume. The autoplay attribute is used to automatically play the video when the page loads. The loop attribute is used to loop the video when it reaches the end. The muted attribute is used to mute the video by default. For example, <video src="video.mp4" controls autoplay loop muted></video> will insert a video with the specified URL, controls, autoplay, loop, and muted attributes. -->

  src="video.mp4"
