<!-- html entities are used to represent special characters in HTML. They are used to display characters that are reserved in HTML, such as <, >, &, etc. They are also used to display characters that are not present on the keyboard, such as ©, ®, etc. -->
<!-- &lt; is used to represent < -->
<p>&lt;</p>
<!-- &gt; is used to represent > -->
<p>&gt;</p>
<!-- &amp; is used to represent & -->
<p>&amp;</p>
<!-- &quot; is used to represent " -->
<p>&quot;</p>
<!-- &apos; is used to represent ' -->
<p>&apos;</p>
<!-- &copy; is used to represent © -->
<p>&copy;</p>
<!-- &reg; is used to represent ® -->
<p>&reg;</p>
<!-- &nbsp; is used to represent a non-breaking space -->
<p>Hello&nbsp;Aditya</p>
