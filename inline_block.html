<!-- inline elements are the elements which do not start on a new line and only takes up as much width as necessary. They are used to format a part of the text or to create a link. Some examples of inline elements are <a>, <span>, <img>, <b>, <i>, etc. -->
<span style="background-color: yellow">Aditya</span>

<!-- block elements are the elements which start on a new line and takes up the full width available. They are used to create a structure for the webpage. Some examples of block elements are <div>, <p>, <h1>, <h2>, <h3>, <h4>, <h5>, <h6>, etc. -->
<div>
  <p style="background-color: lightgray">Aditya</p>
</div>

<!-- heading is inline or block? Test it by using background color -->
<h1 style="background-color: lightblue">Heading</h1>
<!-- heading is a block element because it starts on a new line and takes up the full width available. -->

<!-- paragraph is inline or block? Test it by using background color  -->
<p style="background-color: blanchedalmond">Hello</p>
<!-- paragraph is a block element because it starts on a new line and takes up the full width available. -->
