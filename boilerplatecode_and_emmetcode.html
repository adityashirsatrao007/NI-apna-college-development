<!-- Emmet is a plugin for many popular text editors which greatly improves HTML & CSS workflow. It allows you to write code faster by using abbreviations that expand into full-fledged HTML or CSS code. For example, typing "ul>li*5" and pressing the Emmet expand key will generate an unordered list with five list items. Emmet is widely used by web developers to speed up their coding process and increase productivity. -->

<!-- boilerplate code is the basic structure of an HTML document that is used as a starting point for creating a webpage. It includes the necessary tags and elements that are required for a webpage to function properly. The boilerplate code typically includes the doctype declaration, html tag, head tag, meta tags, title tag, and body tag. It serves as a template for developers to build upon and customize according to their needs. -->
<!-- just press ! and enter -->
<!-- means we are using html5  -->
<!doctype html>

<!-- language is english -->
<!-- html is the root tag -->
<html lang="en">
  <!-- it has meta data inside it -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- it is the name of the tab -->
    <title>Document</title>
  </head>
  <body>
    <p>Boilerplate Code</p>
  </body>
</html>
