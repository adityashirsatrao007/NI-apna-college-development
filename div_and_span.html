<!-- div element is used to create a container for other elements in the webpage. It is defined by the <div> tag. The div element does not have any semantic meaning, it is just a container for other elements. It is used to group elements together and apply styles to them. For example, <div><p>Hello World</p></div> will create a div element that contains a paragraph element with the text "Hello World". -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div style="background-color: lightblue">
      <a href="https://www.google.com" target="_blank">Google</a>
      <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
    </div>

    <!-- span is used to create a container for inline elements in the webpage. It is defined by the <span> tag. The span element does not have any semantic meaning, it is just a container for inline elements. It is used to group inline elements together and apply styles to them. For example, <span><a href="https://www.google.com">Google</a><a href="https://www.linkedin.com">LinkedIn</a></span> will create a span element that contains two anchor elements with the text "Google" and "LinkedIn". -->

    <span style="background-color: lightblue">
      <a href="https://www.google.com" target="_blank">Google</a>
      <a href="https://www.linkedin.com" target="_blank">LinkedIn</a>
    </span>
    <br />
    <a style="background-color: pink" href="helloworld.html">Hello World</a>
  </body>
</html>
