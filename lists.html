<!-- unordered lists -->
<ul>
  <li>item 1</li>
  <li>item 2</li>
  <li>item 3</li>
</ul>

<!-- ordered lists -->
<ol>
  <li>item 1</li>
  <li>item 2</li>
  <li>item 3</li>
</ol>

<!-- type attribute in ordered lists -->
<ol type="1">
  <li>item 1</li>
  <li>item 2</li>
  <li>item 3</li>
</ol>

<ol type="A">
  <li>item 1</li>
  <li>item 2</li>
  <li>item 3</li>
</ol>

<ol type="a">
  <li>item 1</li>
  <li>item 2</li>
  <li>item 3</li>
</ol>

<ol type="I">
  <li>item 1</li>
  <li>item 2</li>
  <li>item 3</li>
</ol>

<ol type="i">
  <li>item 1</li>
  <li>item 2</li>
  <li>item 3</li>
</ol>
