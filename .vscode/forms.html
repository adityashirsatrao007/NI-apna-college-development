<!-- action attribute is used to specify the URL of the server-side script that will handle the form submission. The method attribute is used to specify the HTTP method (GET or POST) that will be used to submit the form data. For example, <form action="submit.php" method="POST"></form> will create a form that submits data to submit.php using the POST method. -->

<form>
  <p>Enter your name</p>
  <input type="text" />
  <br />
  <p>Enter your email</p>
  <input type="email" />
  <br />
  <p>Enter your age</p>
  <input type="number" />
  <br />
  <p>Enter your password</p>
  <input type="password" />
  <br />
  <p>Choose a color</p>
  <input type="color" />
  <br />
  <p>Enter the time</p>
  <input type="time" />
  <br />
  <p>Enter the date</p>
  <input type="date" />
</form>
<hr />

<!-- placeholder is used to provide a hint to the user about what to enter in the input field. It is defined by the placeholder attribute. The text specified in the placeholder attribute will be displayed inside the input field until the user starts typing. For example, <input type="text" placeholder="Enter your name"> will create a text input field with the placeholder text "Enter your name". -->

<input type="text" placeholder="Enter your name" />
<hr />

<!-- label tag is used to create a label for an input element in the webpage. It is defined by the <label> tag. The for attribute is used to specify the id of the input element that the label is associated with. The text between the opening and closing <label> tags is the content of the label. For example, <label for="name">Name:</label><input type="text" id="name"> will create a label that says "Name:" and is associated with the input element with the id "name". -->

<form>
  <label>
    Name:
    <input type="text" placeholder="Enter Name" />
  </label>
</form>
